version: 2

sources:
  - name: TPCH_NOW
    description: >
      Continuously refreshed TPC-H order and line-item data used as the source
      for order analytics. Freshness is measured from each table's LOADED_AT
      timestamp and warns when data is more than two days old.
    database: SADEMOSRC__SOURCE_DATA
    schema: TPCH_NOW
    config:
      freshness:
        warn_after: {count: 2, period: day}
      loaded_at_field: LOADED_AT
    tables:
      - name: LINEITEM
        description: >
          Order-line records at one row per order and line number. Contains the
          selected part and supplier, pricing inputs, fulfillment dates, and
          return and shipping statuses.
        columns:
          - name: L_ORDERKEY
            data_type: NUMBER
            description: Order identifier; joins each line to TPCH_NOW.ORDERS.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('TPCH_NOW', 'ORDERS')
                    field: O_ORDERKEY
          - name: L_PARTKEY
            data_type: NUMBER
          - name: L_SUPPKEY
            data_type: NUMBER
          - name: L_LINENUMBER
            data_type: NUMBER
            description: Sequence number of the line within its order.
            data_tests:
              - not_null
          - name: L_QUANTITY
            data_type: NUMBER
          - name: L_EXTENDEDPRICE
            data_type: NUMBER
          - name: L_DISCOUNT
            data_type: NUMBER
          - name: L_TAX
            data_type: NUMBER
          - name: L_RETURNFLAG
            data_type: TEXT
            description: Return state assigned to the order line.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['A', 'N', 'R']
          - name: L_LINESTATUS
            data_type: TEXT
            description: Fulfillment state of the individual order line.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['F', 'O']
          - name: L_SHIPINSTRUCT
            data_type: TEXT
          - name: L_SHIPMODE
            data_type: TEXT
          - name: L_COMMENT
            data_type: TEXT
          - name: L_SHIPDATE
            data_type: DATE
          - name: L_COMMITDATE
            data_type: DATE
          - name: L_RECEIPTDATE
            data_type: DATE
          - name: LOADED_AT
            data_type: TIMESTAMP_LTZ

      - name: ORDERS
        description: >
          Order headers at one row per order, including customer, status,
          order date, priority, and total price attributes.
        columns:
          - name: O_ORDERKEY
            data_type: NUMBER
            description: Primary key for an order.
            data_tests:
              - unique
              - not_null
          - name: O_CUSTKEY
            data_type: NUMBER
          - name: O_ORDERSTATUS
            data_type: TEXT
            description: "{{ doc('tpch_order_status') }}"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['F', 'O', 'P']
          - name: O_TOTALPRICE
            data_type: NUMBER
            description: Total order price supplied by TPC-H; expected to be positive.
            data_tests:
              - not_null
          - name: O_ORDERDATE
            data_type: DATE
          - name: O_ORDERTIME
            data_type: TIMESTAMP_NTZ
          - name: O_ORDERPRIORITY
            data_type: TEXT
          - name: O_CLERK
            data_type: TEXT
          - name: O_SHIPPRIORITY
            data_type: NUMBER
          - name: O_COMMENT
            data_type: TEXT
          - name: LOADED_AT
            data_type: TIMESTAMP_LTZ

  - name: TPCH_SF001
    description: >
      TPC-H scale-factor 0.01 reference data for parts, suppliers, and their
      commercial relationships. This smaller dataset enriches matching order
      lines but does not cover every part and supplier in TPCH_NOW.
    database: RAW
    schema: TPCH_SF001
    tables:
      - name: PARTSUPP
        description: >
          Bridge between parts and suppliers at one row per part-supplier pair,
          including available quantity and supply cost.
        columns:
          - name: PS_PARTKEY
            data_type: NUMBER
            description: Part identifier; joins to TPCH_SF001.PART.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('TPCH_SF001', 'PART')
                    field: P_PARTKEY
          - name: PS_SUPPKEY
            data_type: NUMBER
            description: Supplier identifier; joins to TPCH_SF001.SUPPLIER.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('TPCH_SF001', 'SUPPLIER')
                    field: S_SUPPKEY
          - name: PS_AVAILQTY
            data_type: NUMBER
          - name: PS_SUPPLYCOST
            data_type: NUMBER
          - name: PS_COMMENT
            data_type: TEXT

      - name: PART
        description: Product reference data at one row per part.
        columns:
          - name: P_PARTKEY
            data_type: NUMBER
            description: Primary key for a part.
            data_tests:
              - unique
              - not_null
          - name: P_NAME
            data_type: TEXT
          - name: P_MFGR
            data_type: TEXT
          - name: P_BRAND
            data_type: TEXT
          - name: P_TYPE
            data_type: TEXT
          - name: P_SIZE
            data_type: NUMBER
          - name: P_CONTAINER
            data_type: TEXT
          - name: P_RETAILPRICE
            data_type: NUMBER
          - name: P_COMMENT
            data_type: TEXT

      - name: SUPPLIER
        description: Supplier reference data at one row per supplier.
        columns:
          - name: S_SUPPKEY
            data_type: NUMBER
            description: Primary key for a supplier.
            data_tests:
              - unique
              - not_null
          - name: S_NAME
            data_type: TEXT
          - name: S_ADDRESS
            data_type: TEXT
          - name: S_NATIONKEY
            data_type: NUMBER
          - name: S_PHONE
            data_type: TEXT
          - name: S_ACCTBAL
            data_type: NUMBER
          - name: S_COMMENT
            data_type: TEXT
